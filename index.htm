<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz Dia dos Namorados ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose-deep:   #C41E5B;
      --ruby:        #8B0000;
      --rose-light:  #FFB6C1;
      --cream:       #FFF0F3;
      --gold:        #D4A373;
      --gold-light:  #F5E6D0;
      --text-dark:   #3a0a1a;
      --text-mid:    #7a2040;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--cream);
      font-family: 'Lora', serif;
      color: var(--text-dark);
      overflow-x: hidden;
    }

    /* ── CANVAS PETALS ── */
    #petals-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem 4rem;
      background: radial-gradient(ellipse at 60% 30%, #ffe0ea 0%, #ffd0df 40%, #f8b4c8 80%, #e8829e 100%);
      z-index: 1;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 80%, rgba(196,30,91,0.15) 0%, transparent 70%);
    }

    .hero-date {
      font-family: 'Lora', serif;
      font-size: clamp(0.75rem, 2vw, 0.9rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--rose-deep);
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 1s ease 0.3s forwards;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 9vw, 7rem);
      font-weight: 700;
      line-height: 1.05;
      color: var(--ruby);
      text-shadow: 0 2px 30px rgba(139,0,0,0.18);
      opacity: 0;
      animation: fadeUp 1s ease 0.6s forwards;
    }

    .hero-title em {
      font-style: italic;
      color: var(--rose-deep);
      display: block;
      font-size: 1.1em;
    }

    /* Heart SVG */
    .heart-wrap {
      margin: 2.5rem auto 1rem;
      opacity: 0;
      animation: fadeUp 1s ease 0.9s forwards;
    }
    .heart-svg {
      width: clamp(60px, 12vw, 100px);
      filter: drop-shadow(0 4px 24px rgba(196,30,91,0.5));
      animation: heartbeat 1.6s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      14%      { transform: scale(1.15); }
      28%      { transform: scale(1); }
      42%      { transform: scale(1.1); }
      56%      { transform: scale(1); }
    }

    .hero-sub {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      font-style: italic;
      color: var(--text-mid);
      margin-top: 1rem;
      opacity: 0;
      animation: fadeUp 1s ease 1.1s forwards;
    }

    .scroll-hint {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      color: var(--rose-deep);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      opacity: 0;
      animation: fadeUp 1s ease 2s forwards;
    }
    .scroll-arrow {
      width: 20px;
      height: 20px;
      border-right: 2px solid var(--rose-deep);
      border-bottom: 2px solid var(--rose-deep);
      transform: rotate(45deg);
      animation: bounce 1.5s ease infinite;
    }
    @keyframes bounce {
      0%,100% { transform: rotate(45deg) translateY(0); }
      50%      { transform: rotate(45deg) translateY(5px); }
    }

    /* ── CAROUSEL SECTION ── */
    .carousel-section {
      position: relative;
      z-index: 1;
      padding: 5rem 1.5rem;
      background: linear-gradient(180deg, #ffd8e6 0%, #fff0f3 100%);
    }

    .section-label {
      text-align: center;
      font-family: 'Lora', serif;
      font-size: 0.8rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }

    .section-title {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      color: var(--ruby);
      margin-bottom: 3rem;
    }

    .carousel-outer {
      position: relative;
      max-width: 780px;
      margin: 0 auto;
    }

    .carousel-track-wrap {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(139,0,0,0.25), 0 0 0 3px var(--gold);
    }

    .carousel-track {
      display: flex;
      transition: transform 0.7s cubic-bezier(0.77,0,0.18,1);
      will-change: transform;
    }

    .carousel-slide {
      min-width: 100%;
      position: relative;
      aspect-ratio: 4/3;
      background: linear-gradient(135deg, #ffd6e0, #ffb3c6, #ff85a1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* shimmer overlay on active slide */
    .carousel-slide.active::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
      animation: shimmer 2.5s ease infinite;
    }
    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    /* caption overlay */
    .slide-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 1.5rem 1.2rem;
      background: linear-gradient(0deg, rgba(80,0,20,0.65) 0%, transparent 100%);
      color: #fff;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .carousel-slide.active .slide-caption {
      opacity: 1;
      transform: translateY(0);
    }

    /* nav buttons */
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 4px 20px rgba(139,0,0,0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .carousel-btn:hover {
      background: #fff;
      box-shadow: 0 6px 28px rgba(139,0,0,0.35);
      transform: translateY(-50%) scale(1.08);
    }
    .carousel-btn svg { fill: var(--rose-deep); }
    .btn-prev { left: -23px; }
    .btn-next { right: -23px; }

    /* dots */
    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 1.5rem;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--rose-light);
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    .dot.active {
      background: var(--rose-deep);
      transform: scale(1.3);
    }

    /* ── LETTER SECTION ── */
    .letter-section {
      position: relative;
      z-index: 1;
      padding: 6rem 1.5rem;
      background: linear-gradient(180deg, #fff0f3 0%, #ffe8f0 50%, #ffd8e6 100%);
    }

    .letter-wrap {
      max-width: 680px;
      margin: 0 auto;
    }

    .letter-card {
      background: #fffbfc;
      border: 1px solid rgba(212,163,115,0.35);
      border-radius: 16px;
      padding: clamp(2rem, 6vw, 4rem
